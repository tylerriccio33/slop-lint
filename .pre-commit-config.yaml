repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types: [python]

      - id: slop-lint
        name: slop-lint
        entry: uv run slop-lint
        language: system
        types: [python]

      - id: tox-tests
        name: tox tests (pytest + coverage)
        entry: uv run tox -e py312
        language: system
        pass_filenames: false
        types: [python]
