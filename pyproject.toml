[project]
name = "slop-lint"
version = "0.1.0"
description = "Lint Python docstrings and comments for ASD-STE100 Simplified Technical English style and banned words"
readme = "README.md"
authors = [
    { name = "Tyler Riccio", email = "tylerriccio8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
slop-lint = "slop_lint.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyrefly>=0.13",
    "tox>=4.23",
    "tox-uv>=1.13",
]

[tool.slop-lint]
enable = ["banned-words", "max-sentence-length", "passive-voice"]
max-sentence-length = 20

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=slop_lint --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/slop_lint"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.pyrefly]
project-includes = ["src", "tests"]
