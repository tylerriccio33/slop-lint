[project]
name = "ste100-lint"
version = "0.1.0"
description = "Lint Python docstrings and comments for ASD-STE100 Simplified Technical English style and banned words"
readme = "README.md"
authors = [
    { name = "Tyler Riccio", email = "tylerriccio8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ste100-lint = "ste100_lint.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pyrefly>=0.13",
]

[tool.ste100-lint]
enable = ["banned-words", "max-sentence-length", "passive-voice"]
banned-words = ["new", "old", "utilize", "leverage", "synergy"]
max-sentence-length = 20

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
